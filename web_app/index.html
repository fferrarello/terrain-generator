<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Terrain Studio PRO</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <!-- Simplex Noise -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <!-- UI Overlay -->
    <div id="ui-panel">
        <div class="header">
            <h1>AI Terrain Studio <span>PRO</span></h1>
            <p>Real-time Procedural Generation</p>
        </div>

        <div class="section">
            <h3>🤖 Real AI Assistant (Gemini)</h3>
            <div class="ai-box">
                <input type="password" id="api-key" placeholder="Enter Gemini API Key..." class="input-field">
                <textarea id="ai-prompt" placeholder="E.g., 'A dense alien forest with rocky mountains, a lake, and a brown bear'"></textarea>
                <button id="ai-generate-btn" class="primary-btn glass-btn">
                    <span class="icon">✨</span> Generate from Prompt
                </button>
            </div>
        </div>

        <div class="section scrollable">
            <h3>🏔️ Terrain Parameters</h3>
            <div class="control-group">
                <label>Resolution: <span id="res-val">100</span></label>
                <input type="range" id="res-slider" min="50" max="250" value="100">
            </div>
            <div class="control-group">
                <label>Height Multiplier: <span id="height-val">25</span></label>
                <input type="range" id="height-slider" min="5" max="100" value="25">
            </div>
            <div class="control-group">
                <label>Noise Scale: <span id="scale-val">3.0</span></label>
                <input type="range" id="scale-slider" min="0.5" max="10" step="0.1" value="3.0">
            </div>
            <div class="control-group">
                <label>Octaves (Detail): <span id="octaves-val">5</span></label>
                <input type="range" id="octaves-slider" min="1" max="8" value="5">
            </div>

            <h3 class="mt-4">🌲 Environment & Paths</h3>
            <div class="control-group">
                <label>Add Winding Path</label>
                <label class="switch">
                    <input type="checkbox" id="path-toggle" checked>
                    <span class="slider round"></span>
                </label>
            </div>
            <div class="control-group">
                <label>Tree Density: <span id="trees-val">150</span></label>
                <input type="range" id="trees-slider" min="0" max="500" value="150">
            </div>
            <div class="control-group">
                <label>Rock Density: <span id="rocks-val">80</span></label>
                <input type="range" id="rocks-slider" min="0" max="300" value="80">
            </div>
        </div>

        <div class="footer-actions">
            <button id="maya-export-btn" class="secondary-btn">
                <span class="icon">🔗</span> Send to Maya 2027
            </button>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="hidden">
        <div class="spinner"></div>
        <h2 id="loading-text">Generating Terrain...</h2>
    </div>

    <script src="main.js"></script>
</body>
</html>
